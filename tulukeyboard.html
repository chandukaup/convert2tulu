<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tulu Keyboard - Type in Tulu Script Online</title>
    <meta name="description" content="Free on-screen Tulu keyboard. Tap the keys to type in Tulu script (Baravu font), with key labels in Tulu, Kannada or IAST.">
    <meta name="author" content="Chandrahasa">
    <link rel="canonical" href="https://convert2tulu.netlify.app/tulukeyboard">
    <link rel="stylesheet" href="/css/common.css?v=1.02">
</head>
<body>
    <!-- Header -->
    <div id="header"></div>

    <!-- Main Container -->
    <div class="container keyboard-page">

        <!-- Info -->
        <div class="info">
            <span class="info-icon">💡</span>
            <span>Tap the keys to type in Tulu. Tap a consonant, then pick its vowel form from the row above it. Keys with an orange dot are Tulu-only sounds. You can show Kannada text in a second box above the Tulu text if you want both together.</span>
        </div>

        <!-- Kannada alongside Tulu (optional) -->
        <div class="kannada-alongside" id="kannadaPanel" hidden>
            <label class="tulu-label" for="kannadaOutput">Kannada text</label>
            <textarea id="kannadaOutput" class="text-area small" readonly placeholder="Same typing, shown in Kannada script…"></textarea>
        </div>

        <!-- Converted Tulu Section -->
        <div class="tulu-section">
            <label class="tulu-label" for="tuluOutput">Tulu Text</label>
            <textarea id="tuluOutput" class="text-area large" readonly placeholder="Tap the keys below..."></textarea>
        </div>

        <!-- Keyboard -->
        <div class="keyboard-section">
            <div class="keyboard-layout-picker">
                <label for="layoutSelect">Layout:</label>
                <select id="layoutSelect">
                    <option value="auto" selected>Automatic</option>
                    <option value="wide">Wide</option>
                    <option value="compact">Compact</option>
                </select>
                <label class="keyboard-option">
                    <input type="checkbox" id="showKannadaPanel">
                    Show Kannada text alongside Tulu
                </label>
            </div>
            <tulu-keyboard id="tuluKeyboard" target="#tuluOutput" persist="tulukeyboard-text"></tulu-keyboard>
        </div>

        <div id="action-button-section"></div>
    </div>

    <!-- Footer -->
    <div id="footer"></div>

    <!-- js for components -->
    <script src="/js/components.js?v=1.02"></script>
    <script>
        document.getElementById('header').innerHTML = renderHeader();
        document.getElementById('footer').innerHTML = renderFooter();
        document.getElementById('action-button-section').innerHTML = renderButtonActions();
        // Tulu Sri uses a different encoding, so only Baravu fonts are offered here.
        document.querySelector('#fontSelect optgroup[label="tulusri-font"]').remove();
    </script>

    <!-- js for application -->
    <script type="text/javascript" src="/js/common.js?v=1.02" charset="utf-8"></script>
    <script src="/tulu-keyboard.js?v=1.02"></script>
    <script>
        const tuluKeyboard = document.getElementById('tuluKeyboard');

        document.getElementById('fontSelect').addEventListener('change', event => {
            tuluKeyboard.setAttribute('font', event.target.value);
        });

        const layoutSelect = document.getElementById('layoutSelect');
        layoutSelect.value = localStorage.getItem('tulukeyboard-layout') || 'auto';
        tuluKeyboard.setAttribute('layout', layoutSelect.value);
        layoutSelect.addEventListener('change', () => {
            tuluKeyboard.setAttribute('layout', layoutSelect.value);
            localStorage.setItem('tulukeyboard-layout', layoutSelect.value);
        });

        const kannadaPanel = document.getElementById('kannadaPanel');
        const showKannadaPanel = document.getElementById('showKannadaPanel');
        const syncKannadaPanel = () => {
            const on = showKannadaPanel.checked;
            kannadaPanel.hidden = !on;
            if (on) {
                tuluKeyboard.setAttribute('kannada-target', '#kannadaOutput');
            } else {
                tuluKeyboard.removeAttribute('kannada-target');
            }
        };
        showKannadaPanel.checked = localStorage.getItem('tulukeyboard-show-kannada') === '1';
        syncKannadaPanel();
        showKannadaPanel.addEventListener('change', () => {
            syncKannadaPanel();
            localStorage.setItem('tulukeyboard-show-kannada', showKannadaPanel.checked ? '1' : '0');
        });

        tuluKeyboard.addEventListener('change', event => {
            debugLog(`Kannada: "${event.detail.kannada}" → Baravu: "${event.detail.baravu}"`);
        });
    </script>

    <!-- for download image -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dom-to-image/2.6.0/dom-to-image.min.js"></script>
</body>
</html>
